<title>Lundro Owner and Admin Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: owner dashboard = fixed 260px sidebar + content; admin = navy top bar + queue/detail split. A floating switcher jumps between flows. */
:root{
  --bg:#F4F8F9; --white:#FFFFFF; --ink:#0F2A3D; --muted:#4B6272; --line:#DCE5EA; --teal:#0A6C7A; --teal-soft:#E3F2F4; --navy:#0F2A3D;
  --sun:#FFC94A; --rust:#9A3412; --peach:#FCD9C4; --ok:#14532D; --ok-bg:#DDF3E4; --amber:#6B4E00; --amber-bg:#FFF4C9; --red:#B42318; --red-bg:#FDE8E6; --violet:#4C1D95; --violet-bg:#EDE4FA;
  --disp:'Bricolage Grotesque',Georgia,serif; --body:'Figtree',system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:0;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,34px);line-height:1.1}
h2{font-size:19px}
.muted{color:var(--muted)}
.btn{min-height:44px;padding:0 20px;border-radius:999px;border:2px solid var(--teal);background:var(--teal);color:#fff;font-weight:700;white-space:nowrap}
.btn.o{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.red{background:#fff;color:var(--red);border-color:var(--red)}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn:disabled{background:#A9B8C1;border-color:#A9B8C1;color:#fff;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-amber{background:var(--amber-bg);color:var(--amber)}.p-red{background:var(--red-bg);color:var(--red)}.p-violet{background:var(--violet-bg);color:var(--violet)}.p-teal{background:var(--teal-soft);color:#0A5360}.p-grey{background:#E8EFF2;color:var(--muted)}.p-dark{background:#E8EFF2;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.inp{width:100%;min-height:46px;border:1px solid #9DB3C0;border-radius:12px;background:#fff;padding:0 14px}
textarea.inp{padding:10px 14px;min-height:90px;resize:vertical}
.inp[readonly]{background:#EEF4F7;color:var(--muted)}
label.f{display:grid;gap:5px;font-size:13px;font-weight:700;color:#3D5160}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap;margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);font-size:15px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--teal)}
.cnt{display:inline-block;min-width:22px;text-align:center;border-radius:999px;background:#E8EFF2;color:var(--muted);font-size:12px;padding:1px 7px;margin-left:4px}
.tabs button[aria-selected="true"] .cnt{background:var(--navy);color:#fff}
.link{background:none;border:0;padding:0;font-weight:700;color:var(--teal);text-decoration:underline}
/* shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;font:700 24px var(--disp);padding:0 8px 14px}
.who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px;font-size:13px}
.cc{width:40px;height:40px;border-radius:10px;background:var(--navy);color:var(--sun);display:grid;place-items:center;font:700 13px var(--disp);flex:none}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:0 12px;min-height:46px;font-weight:600;font-size:16px;text-align:left;width:100%}
.nav button[aria-current="page"]{background:var(--teal-soft);color:#0A5360}
.nav button:hover{background:#F0F6F8}
.nav .ic{width:22px;height:22px;flex:none}
.nav .bd{margin-left:auto;min-width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--navy);color:#fff}
.nav .bd.w{background:var(--red-bg);color:var(--red)}
.main{padding:28px 32px 90px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:4px}.nav button{min-height:44px;width:auto}.main{padding:18px 16px 90px}.who{display:none}}
/* alerts */
.alert{display:flex;align-items:center;gap:14px;border-radius:14px;padding:12px 16px;margin-bottom:10px;flex-wrap:wrap;border:1px solid transparent}
.alert .i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.alert p{margin:0;flex:1;min-width:200px}
.a-amber{background:#FFF4C9;border-color:#F3DA7B}.a-amber .i{background:#8A6A00}
.a-red{background:#FDE8E6;border-color:#F5C2BD}.a-red .i{background:#C0291B}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-block:18px}
.stat b{display:block;font:700 34px/1.1 var(--disp);margin-block:6px 4px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.req{padding-block:16px;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req .r{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.req .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.urg{color:#9A3412;font-size:13px;font-weight:600}
.row2{display:flex;gap:12px;padding-block:12px;border-top:1px solid var(--line);align-items:center}
.time{background:var(--teal-soft);border-radius:10px;padding:6px 8px;text-align:center;font-size:13px;font-weight:700;min-width:70px;flex:none}
/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
@media (max-width:1100px){.calwrap{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);overflow-x:auto}
.cal .h{background:#EEF4F7;font-size:12px;font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:grid;gap:4px;align-content:start;min-width:90px}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:#F4F8F9}
.cal .d.today{background:#E9F6F7}
.cal .n{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.today-b{background:var(--teal);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px}
.ev{border:2px solid transparent;border-radius:6px;padding:3px 7px;font-size:12px;font-weight:700;text-align:left;line-height:1.25;width:100%}
.ev.t{background:var(--teal);color:#fff}.ev.p{background:var(--peach);color:var(--rust)}.ev.n{background:var(--navy);color:#fff}
.ev.req{border:2px dashed #F5B87A;background-clip:padding-box}.ev.n.req{border-color:var(--sun)}.ev.t.req{border-color:var(--sun)}
.ev.x{background:#fff;color:#B42318;border:1px solid #F5C2BD;text-decoration:line-through}
.ev.b{background:repeating-linear-gradient(135deg,#F1F5F7 0 6px,#E3EBEF 6px 12px);color:var(--muted);border:1px solid #C9D6DD}
.ev.sel{outline:3px solid var(--sun)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;font-weight:600}
/* bookings */
.bk{display:flex;gap:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;margin-bottom:10px;flex-wrap:wrap;text-align:left;width:100%}
.bk[aria-pressed="true"]{border:2px solid var(--teal);padding:13px}
.dt{background:#EEF4F7;border-radius:10px;padding:6px 10px;text-align:center;font-size:12px;min-width:56px;height:fit-content}
.dt b{display:block;font:700 22px var(--disp);line-height:1.1}
.sum div{display:flex;justify-content:space-between;gap:10px;padding-block:4px;font-variant-numeric:tabular-nums}
.sum .t{font:700 18px var(--disp);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
/* boats */
.boats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.bcard .pic{position:relative;aspect-ratio:2/1}.bcard .pic svg{display:block;width:100%;height:100%}
.bcard .pic .pill{position:absolute;left:10px;top:10px;background:#fff}
.bcard .bd{padding:14px;display:grid;gap:8px;flex:1;align-content:start}
.callout{border-radius:10px;padding:8px 10px;font-size:13px}
.c-amber{background:var(--amber-bg);color:var(--amber)}.c-red{background:var(--red-bg);color:var(--red)}.c-grey{background:#EEF4F7;color:#3D5160}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:10px 16px}
.chip{border:1px solid #9DB3C0;background:#fff;border-radius:999px;padding:0 14px;min-height:36px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:#3D5160}
tr.sel td{background:#EEF8F9}
tr:last-child td{border-bottom:0}
.tl{font-weight:700;color:var(--teal);text-decoration:underline;background:none;border:0;padding:0;text-align:left}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
/* messages */
.msgs{display:grid;grid-template-columns:310px minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:540px}
@media (max-width:820px){.msgs{grid-template-columns:1fr}}
.thr{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;width:100%;font-size:13px}
.thr[aria-current="true"]{background:#E3F2F4}
.thr b.n{font-size:15px}
.bub{background:#F4F8F9;border-radius:16px;padding:10px 14px;max-width:80%;width:fit-content}
.bub.me{background:var(--teal);color:#fff;margin-left:auto}
.bubm{font-size:12px;color:var(--muted);margin:4px 4px 12px}
.bubm.me{text-align:right}
/* chart */
.bars{display:flex;align-items:flex-end;gap:2%;height:220px;border-bottom:1px solid #9DB3C0;margin-left:44px;position:relative}
.bars .g{position:absolute;left:0;right:0;border-top:1px solid #E8EFF2}
.bars .gl{position:absolute;left:-44px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.bars button{flex:1;border:0;border-radius:4px 4px 0 0;background:var(--teal);min-height:0;position:relative;z-index:1;padding:0}
.bars button.cur{background:#5FA6B1}
.bars button:hover,.bars button:focus-visible{background:#08505B}
.xl{display:flex;gap:2%;margin-left:44px;font-size:12px;color:var(--muted)}.xl span{flex:1;text-align:center}
/* reviews */
.rv{margin-bottom:12px}
.stars{color:#B7791F;letter-spacing:1px}
.reply{background:#EEF4F7;border-radius:10px;padding:10px 14px;margin-top:10px}
/* admin */
.adm{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 28px;flex-wrap:wrap}
.adm .pill{background:var(--sun);color:var(--navy)}
.q{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.q{grid-template-columns:1fr}}
.qi{display:block;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.qi[aria-pressed="true"]{border:2px solid var(--teal);padding:11px 15px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin-block:14px}
.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){font-weight:600}
@media (max-width:560px){.kv{grid-template-columns:1fr}}
.docs{display:flex;gap:12px;flex-wrap:wrap}
.doc{width:230px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;text-align:left;padding:0}
.doc i{display:block;height:100px;background:repeating-linear-gradient(#fff 0 12px,#E8EFF2 12px 13px)}
.doc span{display:block;padding:10px;background:#F4F8F9;font-weight:600;font-size:13px}
.chk{display:flex;gap:14px;align-items:center;padding-block:12px;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--teal)}
/* onboarding */
.ob{max-width:1100px;margin-inline:auto;padding:0 16px 90px}
.obh{background:#fff;border-bottom:1px solid var(--line)}
.obh>div{max-width:1100px;margin:auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stp{display:flex;gap:8px;flex-wrap:wrap;margin-block:24px 18px}
.stp span{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px 6px 8px;font-weight:700;font-size:14px}
.stp b{width:28px;height:28px;border-radius:50%;background:#E8EFF2;display:grid;place-items:center;font-size:13px}
.stp .cur{border:2px solid var(--teal);background:var(--teal-soft)}.stp .cur b{background:var(--teal);color:#fff}.stp .done b{background:var(--ok);color:#fff}
.rad{display:flex;gap:12px;border:1px solid #C9D6DD;border-radius:14px;padding:16px;background:#fff;text-align:left;width:100%}
.rad[aria-pressed="true"]{border:2px solid var(--teal);background:var(--teal-soft);padding:15px}
.rad i{width:20px;height:20px;border-radius:50%;border:2px solid #7B8F9B;flex:none;margin-top:2px;background:#fff}
.rad[aria-pressed="true"] i{border-color:var(--teal);background:radial-gradient(var(--teal) 45%,#fff 50%)}
.rad small{display:block;color:var(--muted)}
.cb{display:flex;gap:10px;align-items:center;font-weight:600;padding-block:6px}
.cb input{width:20px;height:20px;accent-color:var(--teal)}
.err{color:var(--red);font-weight:600;font-size:13px;margin:4px 0 0}
/* switcher + toast */
.sw{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border-radius:999px;padding:5px;display:flex;gap:2px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:13px}
.sw span{padding:8px 10px 8px 14px;color:#9DB3C0;font-weight:600}
.sw button{border:0;background:none;color:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
.sw button[aria-pressed="true"]{background:var(--sun);color:var(--navy)}
@media (max-width:620px){.sw span{display:none}}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw}
</style>

<div id="root"></div>
<div class="sw" role="group" aria-label="Prototype flows"><span>Prototype</span><button data-flow="ob">Owner signup</button><button data-flow="own">Owner dashboard</button><button data-flow="adm">Admin</button></div>

  function render(keep){
    var y=window.scrollY;
    var html=S.flow==='ob'?pOnboard():S.flow==='adm'?pAdmin():shell(PAGES[S.page]());
    root.innerHTML=html;
    document.querySelectorAll('.sw button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.flow===S.flow)});
    window.scrollTo(0,keep?y:0);
  }
  function setFlow(f){S.flow=f;render()}
  function accept(id){
    var r=S.reqs.filter(function(x){return x.id===id})[0];if(!r)return;r.st='Confirmed';toast('Accepted. '+r.name+' has been notified.');S.bkSel=id;render(true)}
  function decline(id){var r=S.reqs.filter(function(x){return x.id===id})[0];if(!r)return;r.st='Declined';toast('Declined. '+r.name+' has been notified.');render(true)}

  document.querySelector('.sw').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setFlow(b.dataset.flow)});
  root.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='draft')S.draft=t.value;else if(t.id==='rtxt')S.replyTxt=t.value;else if(t.id==='amsg')S.aMsg=t.value;
    else if(t.dataset.of)S.ob.f[t.dataset.of]=t.value;
    else if(t.dataset.sf)S.setF[t.dataset.sf]=t.value;
    else if(t.id==='bkq'){S.bkQ=t.value;var p=t.selectionStart;render(true);var n=document.getElementById('bkq');n.focus();n.setSelectionRange(p,p)}
    else if(t.id==='cq'){S.custQ=t.value;var p2=t.selectionStart;render(true);var n2=document.getElementById('cq');n2.focus();n2.setSelectionRange(p2,p2)}
  });
  root.addEventListener('change',function(e){
    var t=e.target,d=t.dataset;
    if(t.id==='cs'){S.custSort=t.value;render(true)}
    else if(t.id==='txf'){S.txF=t.value;render(true)}
    else if(t.id==='rvb'){S.revBoat=t.value;render(true)}
    else if(d.cal){S.calOn[d.cal]=t.checked;render(true)}
    else if(d.exb!==undefined){S.exBoats[+d.exb]=t.checked;render(true)}
    else if(d.exo!==undefined){S.exOver[+d.exo]=t.value}
    else if(d.nf){S.notif[d.nf]=t.checked}
    else if(d.safe){S.ob.safe[d.safe]=t.checked;render(true)}
    else if(d.achk){S.aChk[d.achk]=t.checked;render(true)}
  });
  root.addEventListener('mouseover',function(e){var b=e.target.closest('[data-bar]');if(b){var p=b.dataset.bar.split('|');S.barTip=p[0]+': '+$(+p[1]);var el=root.querySelector('[aria-live="polite"]');if(el)el.textContent=S.barTip}});
  root.addEventListener('focusin',function(e){var b=e.target.closest('[data-bar]');if(b){var p=b.dataset.bar.split('|');S.barTip=p[0]+': '+$(+p[1]);var el=root.querySelector('[aria-live="polite"]');if(el)el.textContent=S.barTip}});
  root.addEventListener('click',function(e){
    var t=e.target.closest('[data-flow],[data-page],[data-accept],[data-decline],[data-msgto],[data-ev],[data-block],[data-doblock],[data-cm],[data-bktab],[data-bk],[data-addboat],[data-boatf],[data-pause],[data-dup],[data-exsel],[data-addex],[data-saveex],[data-cust],[data-thr],[data-quick],[data-send],[data-bar],[data-rvtab],[data-reply],[data-postreply],[data-ver],[data-settab],[data-savesettings],[data-toast],[data-acct],[data-obnext],[data-obback],[data-obsubmit],[data-addphoto],[data-time],[data-tier],[data-pay],[data-atab],[data-asel],[data-aact],[data-tax],[data-exp]');
    if(!t)return;var d=t.dataset;
    if(d.flow){setFlow(d.flow);return}
    if(d.accept){accept(d.accept);return}
    if(d.decline){decline(d.decline);return}
    if(d.msgto){var i=S.thr.map(function(x){return x.n}).indexOf(d.msgto);if(i<0){S.thr.unshift({n:d.msgto,i:d.msgto.split(' ').map(function(w){return w[0]}).join('').slice(0,2),c:'#CBE6EA',t:'Now',sub:'New conversation',un:false,m:[]});i=0}S.thrSel=i;S.thr[i].un=false;S.page='messages';render();return}
    if(d.page){S.page=d.page;if(d.settab)S.setTab=d.settab;if(d.block==='1')S.blockOpen=true;render();return}
    if(d.settab){S.setTab=d.settab;render(true);return}
    if(d.toast){toast(d.toast);return}
    if(d.ev){var p=d.ev.split('|'),parts=p[1].split(' · ');var bn={'Bennington':"24' Bennington Pontoon",'MasterCraft':"22' MasterCraft XT22",'Harris':"26' Harris Grand Mariner"}[p[2]];var rq=S.reqs.filter(function(r){return r.d===+p[0]&&r.boat===bn&&r.st==='Request'}).length;S.calSel={d:+p[0],t:parts[0],name:parts[1],boat:bn,st:rq?'Request':parts[0].indexOf('Sam')>=0?'Cancelled':'Confirmed'};if(p[1].indexOf('Sam N.')>=0)S.calSel.st='Cancelled';render(true);return}
    if(d.block!==undefined){S.blockOpen=d.block==='1';render(true);return}
    if(d.doblock){var bb=document.getElementById('bkBoat').value,dd=+document.getElementById('bkDay').value;if(dd>=1&&dd<=30){S.blocks.push({d:dd,boat:bb});S.blockOpen=false;toast('Blocked June '+dd+' for '+bb+'.');render(true)}return}
    if(d.cm){S.calMonth=((S.calMonth+ +d.cm)%3+3)%3;render(true);return}
    if(d.bktab){S.bkTab=d.bktab;S.bkSel='';render(true);return}
    if(d.bk){S.bkSel=d.bk;render(true);return}
    if(d.addboat){S.flow='ob';S.ob.step=3;S.ob.done=false;render();return}
    if(d.boatf){S.boatF=d.boatf;render(true);return}
    if(d.pause){var b=boatSt(d.pause);if(b.st==='Live'){b.st='Paused';b.resumed=true;b.meta=b.meta.split(' · Next')[0]+' · Paused today';b.note=['grey','Paused by you. Renters can’t book it until you resume.'];toast(b.n+' paused.')}else{b.st='Live';b.resumed=false;b.note=null;toast(b.n+' is live again.')}render(true);return}
    if(d.dup){var s=boatSt(d.dup);S.boats.push({id:'cp'+S.boats.length,n:s.n+' (copy)',st:'Draft',meta:'Copied from '+s.n+' · Last edited today',pal:s.pal,note:['grey','Draft: review the details and photos, then submit.']});toast('Duplicated as a draft.');render(true);return}
    if(d.exsel){S.exSel=+d.exsel;render(true);return}
    if(d.addex){S.extras.push(['New extra',10,'per booking',1,'Service (pending NCDOR guidance)','Custom',0]);S.exSel=S.extras.length-1;toast('Custom extra added. Set its price and boats.');render(true);return}
    if(d.saveex){var pv=document.getElementById('exPrice').value.replace(/[^\d.]/g,'');if(+pv>0)S.extras[S.exSel][1]=+pv;toast('Extra saved.');render(true);return}
    if(d.cust){S.custSel=+d.cust;render(true);return}
    if(d.thr){S.thrSel=+d.thr;S.thr[S.thrSel].un=false;render(true);return}
    if(d.quick){S.draft=d.quick;render(true);var ta=document.getElementById('draft');if(ta)ta.focus();return}
    if(d.send){var tx=(S.draft||'').trim();if(!tx)return;var th=S.thr[S.thrSel];th.m.push([tx,'You · Just now',1]);th.pre='You: '+tx.slice(0,26)+'…';S.draft='';render(true);return}
    if(d.rvtab){S.revTab=d.rvtab;render(true);return}
    if(d.reply){S.replyOpen=+d.reply;S.replyTxt='';render(true);return}
    if(d.postreply){var rt=(S.replyTxt||'').trim();if(!rt){toast('Write a reply first.');return}S.revs[+d.postreply][5]=rt;S.replyOpen=-1;toast('Reply posted.');render(true);return}
    if(d.ver){S.ver[d.ver]=true;if(d.ver==='sr'){var sr=boatSt('sr');sr.st='Pending review';sr.note=['amber','New certificate in review. Usually 1 to 2 business days.']}if(d.ver==='by'){var by=boatSt('by');by.st='Pending review';by.note=['amber','New document in review. Usually 1 to 2 business days.']}toast('Document uploaded. We\'ll review it shortly.');render(true);return}
    if(d.savesettings){toast('Changes saved.');return}
    // onboarding
    if(d.acct){S.ob.acct=d.acct;render(true);return}
    if(d.addphoto){S.ob.f.photos++;render(true);return}
    if(d.time){S.ob.times[d.time]=!S.ob.times[d.time];render(true);return}
    if(d.tier){S.ob.f.tier=d.tier;render(true);return}
    if(d.pay){if(d.pay==='connect'){S.ob.f.pay='connecting';render(true);setTimeout(function(){S.ob.f.pay='done';if(S.flow==='ob')render(true)},1100)}else{S.ob.f.pay='skipped';render(true)}return}
    if(d.obback){S.ob.step=Math.max(1,S.ob.step-1);S.ob.tried=false;render();return}
    if(d.obnext){if(!obValid()){S.ob.tried=true;render(true);toast('Please fix the highlighted fields.');return}S.ob.step++;S.ob.tried=false;render();return}
    if(d.obsubmit){S.ob.done=true;S.queue.some(function(q){return q.id==='nw'})||S.queue.unshift({id:'nw',t:S.ob.f.boat,o:S.ob.f.biz+' · Cornelius',when:'Submitted today · 0 days',kind:'New listing'});render();return}
    // admin
    if(d.atab){S.aTab=d.atab;render(true);return}
    if(d.asel){S.aSel=d.asel;S.aMsg='';S.aErr='';render(true);return}
    if(d.aact){
      var q=S.queue.filter(function(x){return x.id===S.aSel})[0]||S.queue[0];if(!q)return;
      var msg=(S.aMsg||'').trim();
      if(d.aact!=='approve'&&msg.length<5){S.aErr='Write a message to the owner first. It is required for Request info and Reject.';render(true);return}
      var bk=boatSt(q.id);
      if(d.aact==='approve'){if(bk){bk.st='Live';bk.note=null;bk.meta=bk.meta.split(' · Submitted')[0]+' · Live today'}if(q.id==='th')S.ver.th=true;toast(q.t+' approved and live.')}
      if(d.aact==='info'){if(bk){bk.st='Additional info required';bk.note=['red',msg]}toast('Info requested from the owner.')}
      if(d.aact==='reject'){if(bk){bk.st='Draft';bk.note=['grey','Rejected: '+msg]}toast('Listing rejected. The owner was notified.')}
      S.queue=S.queue.filter(function(x){return x.id!==q.id});S.aSel=S.queue[0]?S.queue[0].id:'';S.aMsg='';S.aErr='';render(true);return}
    if(d.tax){var p2=d.tax.split('|');S.tax=S.tax.filter(function(x){return x.id!==p2[1]});toast(p2[0]==='ok'?'Exemption approved.':'Tax will be charged before the trip.');render(true);return}
    if(d.exp){var p3=d.exp.split('|');S.exp=S.exp.filter(function(x){return x.id!==p3[1]});toast(p3[0]==='remind'?'Reminder sent.':'Boat paused until a new document is approved.');render(true);return}
  });
  render();
})();
</script>
