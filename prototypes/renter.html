<title>Lundro Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: faithful to the Lundro design PDF. Single light brand look: navy ink, teal actions, sun-yellow accents. */
:root{
  --bg:#F4F8F9; --white:#FFFFFF; --ink:#0F2A3D; --muted:#4B6272; --line:#DCE5EA; --teal:#0A6C7A; --teal-soft:#E3F2F4;
  --navy:#0F2A3D; --sun:#FFC94A; --rust:#C2410C; --ok:#14532D; --ok-bg:#DDF3E4; --amber-bg:#FFF1C4; --sand:#F3EBDD;
  --disp:'Bricolage Grotesque',Georgia,serif; --body:'Figtree',system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:0;padding-block:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.c{max-width:1100px;margin-inline:auto;padding-inline:16px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,56px);line-height:1.04}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.15}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* header */
.hd{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hd .c{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:700 24px var(--disp);background:none;border:0;padding:0}
.hd nav{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hd nav button{background:none;border:0;font-weight:600;font-size:14px;padding:10px 10px;min-height:44px}
.hd nav .nl{font-weight:600;font-size:14px;padding:0 10px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
.hd nav .pillb{border:1px solid var(--ink);border-radius:999px;padding:0 16px}
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:2px solid var(--teal);background:var(--teal);color:#fff;font-weight:700}
.btn.o{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.y{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
/* hero */
.hero{background:#CFE8F5;position:relative;overflow:hidden;padding-block:48px 56px}
.hero .bg{position:absolute;inset:0;width:100%;height:100%}
.hero .c{position:relative}
.tagp{display:inline-block;background:#fff;border-radius:999px;font-weight:700;font-size:12px;padding:6px 12px;margin-bottom:16px}
.hero p.lead{max-width:420px;font-size:17px;margin:14px 0 26px}
.sbox{background:#fff;border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;box-shadow:0 8px 28px rgba(15,42,61,.14);max-width:640px}
.sbox label{display:grid;gap:3px;font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1 1 150px}
.inp{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;width:100%}
.gstep{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 8px;background:#fff}
.gstep button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:700}
.trust{background:#fff;border-bottom:1px solid var(--line)}
.trust .c{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;padding-block:22px}
.trust div.t{display:flex;gap:12px;align-items:flex-start;font-size:13px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700}
.sec{padding-block:44px 8px}
.sechd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.link{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;color:var(--teal);font-size:14px}
/* boat cards */
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px 16px}
.bc{background:none;border:0;padding:0;text-align:left;display:grid;gap:4px;align-content:start;min-width:0}
.art{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;margin-bottom:6px;background:#CFE8F5}
.art svg{display:block;width:100%;height:100%}
.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;font-size:16px}
.heart[aria-pressed="true"]{color:#C2410C}
.bc .r{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bc h3{font-size:15px;line-height:1.25}
.bc small{color:var(--muted);font-size:13px}
.new{background:#FFE7DC;color:#9A3412;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tg span{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}
.t1{background:var(--teal-soft);color:#0A5360}.t2{background:var(--sand);color:#5B4A2E}.t3{background:var(--amber-bg);color:#6B4E00}
.lakes{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:760px){.lakes{grid-template-columns:1fr}}
.lakecard{background:#256080;color:#fff;border-radius:22px;padding:28px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:left;border:0;position:relative;overflow:hidden}
.lakecard svg{position:absolute;right:10%;top:-10px;opacity:.25}
.lakecard span.n{background:var(--sun);color:var(--navy);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px;align-self:flex-start;position:relative}
.dash{border:1.5px dashed #9DB3C0;border-radius:22px;padding:28px;background:#fff;display:grid;gap:12px;align-content:center}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.how div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.how b.n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;margin-bottom:10px}
.own{background:var(--navy);color:#fff;border-radius:24px;padding:32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-block:44px}
.ft{background:var(--navy);color:#CFE0E8;padding-block:36px;margin-top:56px;font-size:14px}
.ft .c{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px}
.ft b{color:#fff;display:block;margin-bottom:6px}
.ft a{display:block;color:#CFE0E8;padding:3px 0;text-decoration:none}
.ft button{display:block;background:none;border:0;color:#CFE0E8;padding:3px 0;text-align:left}
/* lake page */
.dark{background:var(--navy);color:#fff;padding-block:28px 40px;position:relative;overflow:hidden}
.dark svg.shape{position:absolute;right:6%;top:0;height:120%;opacity:.5}
.dark .c{position:relative}
.crumb{font-size:12px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.tile b{display:block;font-size:14px}.tile small{color:var(--muted);font-size:13px}
.know{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:20px;margin-top:36px;font-size:13px}
@media (max-width:760px){.know{grid-template-columns:1fr}}
.faq{max-width:700px;margin:40px auto 0}
.faq details{border-top:1px solid var(--line);padding-block:14px}.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{font-weight:700;cursor:pointer;font-size:15px}
.faq p{margin:8px 0 0;color:var(--muted);font-size:14px}
/* search */
.sbar{background:#fff;border-bottom:1px solid var(--line)}
.sbar .c{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
.pillsearch{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:0 2px 8px rgba(15,42,61,.08)}
.pillsearch label{font:700 9px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:grid}
.pillsearch input,.pillsearch select{border:0;background:none;font-weight:600;padding:0;min-height:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #9DB3C0;background:#fff;border-radius:999px;padding:0 14px;min-height:38px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:inline-flex;background:#E8EFF2;border-radius:999px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}.mapcol{display:none}.split.showmap .listcol{display:none}.split.showmap .mapcol{display:block}}
.listcol{padding:20px 16px}
.listcol .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 16px;margin-top:18px}
.mapcol{position:sticky;top:112px;height:calc(100vh - 112px);min-height:480px}
.map{position:relative;width:100%;height:100%;background:#E6EEDF;overflow:hidden}
.map svg.l{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);background:#fff;border:0;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.25);min-height:30px}
.pin[aria-pressed="true"]{background:var(--navy);color:#fff;z-index:3}
.pop{position:absolute;transform:translate(-50%,-100%);margin-top:-26px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;z-index:4;min-width:210px}
.mapnote{position:absolute;left:12px;bottom:12px;right:12px;background:#fff;border-radius:12px;padding:10px 14px;font-size:12px;max-width:300px}
.mapfab{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10}
@media (max-width:900px){.mapfab{display:block}}
/* boat page */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;border-radius:20px;overflow:hidden;height:min(48vw,400px);min-height:220px}
.gal div:first-child{grid-row:span 2}
.gal button{border:0;padding:0;background:none;position:relative;min-height:0}
.gal svg{width:100%;height:100%;display:block;object-fit:cover}
@media (max-width:640px){.gal{grid-template-columns:1fr 1fr}.gal div:first-child{grid-column:span 2}.gal div:nth-child(n+4){display:none}}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bd{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.bg1{background:var(--ok-bg);color:var(--ok)}.bg2{background:var(--teal-soft);color:#0A5360}.bg3{background:var(--amber-bg);color:#6B4E00}
.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:start;margin-top:26px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line);font-size:13px}
.spec b{display:block;font-size:15px}
.blk{padding-block:22px;border-bottom:1px solid var(--line)}
.blk h2{font-size:22px;margin-bottom:12px}
.opts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.xcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.xcard small{display:block;color:var(--muted);font-size:13px}
.rsv{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 28px rgba(15,42,61,.1);position:sticky;top:84px}
.rsv .price{font:700 28px var(--disp)}
.rsv label{display:grid;gap:4px;font-size:12px;font-weight:700;margin-top:12px}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pk{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:left}
.pk[aria-pressed="true"]{border:2px solid var(--teal);background:var(--teal-soft);padding:7px 11px}
.tm{border:1px solid #9DB3C0;background:#fff;border-radius:999px;padding:0 16px;min-height:40px;font-weight:700}
.tm[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rev{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
.resp{background:#EEF4F7;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
.host{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cc{width:50px;height:50px;border-radius:12px;background:var(--navy);color:var(--sun);display:grid;place-items:center;font:700 15px var(--disp)}
dl.s{display:grid;grid-template-columns:1fr 1fr;margin:0;font-size:14px}dl.s dt,dl.s dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}dl.s dd{font-weight:700;text-align:right}dl.s dt{color:var(--muted)}
.pol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;font-size:13px}
.pol b{display:block;font-size:14px}
.safe{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;font-size:14px}
/* checkout */
.cohd{background:#fff;border-bottom:1px solid var(--line)}
.cohd .c{display:flex;align-items:center;gap:12px;min-height:68px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-block:18px 22px}
.steps div{border-top:5px solid #DCE5EA;padding-top:6px;font-size:12px;font-weight:700;color:var(--muted);border-radius:3px}
.steps div.on{border-color:var(--teal);color:var(--ink)}
@media (max-width:640px){.steps div span{display:none}.steps div::after{content:attr(data-n)}}
.cogrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.cogrid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}
.card h2{margin-bottom:16px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.frow label{display:grid;gap:5px;font-size:13px;font-weight:700}
.rad{display:flex;gap:12px;align-items:flex-start;border:1px solid #C9D6DD;border-radius:14px;padding:14px;background:#fff;text-align:left;width:100%}
.rad[aria-pressed="true"]{border:2px solid var(--teal);background:var(--teal-soft);padding:13px}
.rad i{width:20px;height:20px;border-radius:50%;border:2px solid #7B8F9B;flex:none;margin-top:2px;background:#fff}
.rad[aria-pressed="true"] i{border-color:var(--teal);background:radial-gradient(var(--teal) 45%,#fff 50%)}
.rad span small{display:block;color:var(--muted);font-size:14px}
.stack{display:grid;gap:10px}
.nav2{display:flex;justify-content:space-between;margin-top:18px;gap:10px;align-items:center}
.sumcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;position:sticky;top:20px;font-size:15px}
.sum{display:grid;gap:7px;font-variant-numeric:tabular-nums}.sum div{display:flex;justify-content:space-between;gap:10px}
.sum hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.sum .t{font:700 22px var(--disp)}.sum .m{color:var(--muted);font-size:13px}
.err{color:#B42318;font-weight:600;font-size:14px;margin:6px 0 0}
.stp{display:flex;align-items:center;gap:10px}.stp button{width:36px;height:36px;border-radius:50%;border:1px solid #9DB3C0;background:#fff;font-weight:700}.stp button:disabled{opacity:.35}
.xrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}.xrow:last-child{border:0}
.xrow small{display:block;color:var(--muted);font-size:13px}
.note{background:var(--amber-bg);border-radius:12px;padding:12px 14px;font-size:14px}
/* confirmation */
.ok{background:var(--ok-bg);border-radius:20px;padding:22px;display:flex;gap:16px;align-items:center;margin-block:16px}
.ok .ck{width:48px;height:48px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.ok.rq{background:var(--teal-soft)}.ok.rq .ck{background:var(--teal)}
.cgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.cgrid{grid-template-columns:1fr}}
.cgrid .card{padding:18px;margin-bottom:14px}.cgrid h3{font-size:18px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:14px}.kv b{font-weight:700}.kv span:nth-child(odd){color:var(--muted)}
.ck2{display:flex;gap:10px;align-items:center;padding-block:8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:50}
</style>

     +'<div class="cgrid"><div><div class="card"><h3>Your trip</h3><div class="kv"><span>Boat</span><b>'+b.t+'</b><span>When</span><b>'+fdateY(S.date)+' · '+S.time+' – '+end+'</b><span>Guests</span><b>'+Math.min(S.guests,b.g)+'</b><span>Captain</span><b>'+(S.cap&&b.cap?'Mike R. (USCG licensed)':'Self-drive')+'</b><span>Extras</span><b>'+(q.lines.map(function(l){return l[0]}).join(', ')||'None')+'</b></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn o sm" data-toast="Added to your calendar (demo).">Add to calendar</button><button class="btn o sm" data-toast="Directions open in Maps (demo).">Get directions</button></div></div>'
     +(req?'':'<div class="card"><h3>Pickup details</h3><b>Harbor Point Marina, Slip B14</b><p style="margin:2px 0 6px">20210 Harbor Point Ln, '+b.area+', NC 28031</p><p class="muted" style="font-size:14px;margin:0">Park in the gravel lot by the bait shop; spaces marked “Rental guests”. Walk down dock B. Arrive 15 minutes early for the safety briefing.</p></div>')
     +'<div class="card"><h3>Your host</h3><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="cc" style="width:44px;height:44px;font-size:13px">C&amp;C</span><span style="flex:1;min-width:180px"><b>Cove &amp; Co. Boat Rentals</b><br><span class="muted" style="font-size:13px">(704) 555-0142 · bookings@coveandco.example</span></span><button class="btn o sm" data-toast="Messaging opens in the full app.">Message host</button></div></div>'
     +'<div class="card"><h3>Before you go</h3>'+items.map(function(t,i){return '<label class="ck2"><input type="checkbox" data-ck="'+i+'"> <span>'+t+'</span></label>'}).join('')+'</div></div>'
     +'<div><div class="card"><h3>Receipt</h3><div class="sum" style="font-size:14px"><div><span>Boat · '+(S.len==='half'?'Half':'Full')+' day</span><span>'+$(q.boat)+'</span></div>'+q.lines.map(function(l){return '<div><span>'+l[0]+'</span><span>'+$(l[1])+'</span></div>'}).join('')+(q.cap?'<div><span>Captain · '+q.hrs+' hrs × $50</span><span>'+$(q.cap)+'</span></div>':'')+'<div><span>Lundro service fee</span><span>'+$(q.fee)+'</span></div><hr><div><b>NC sales tax</b><b>'+(review?'Exempt (in review)':$(q.tax))+'</b></div><div style="color:var(--muted)"><span>State (3% boat · 4.75% gear)</span><span>'+$(q.st)+'</span></div><div style="color:var(--muted)"><span>County (Mecklenburg 2%)</span><span>'+$(q.co)+'</span></div><div style="color:var(--muted)"><span>Transit (1.5%)</span><span>'+$(q.tr)+'</span></div><hr><div class="t" style="display:flex;justify-content:space-between;font-size:18px"><b>'+(req?'Total if accepted':'Total paid')+'</b><b>'+$(q.total)+'</b></div><div style="color:var(--muted)"><span>Security deposit hold</span><span>$500.00</span></div></div><button class="btn o" style="width:100%;margin-top:12px" data-toast="Receipt PDF downloads in the full app.">Download receipt (PDF)</button></div>'
     +'<div class="card"><h3>Need to cancel?</h3><p class="muted" style="font-size:14px;margin:0 0 8px">Moderate policy: full refund, tax included, until 5 days before your trip. 50% after that.</p><button class="link" data-toast="Cancellation is handled in the full app.">Cancel booking</button></div></div></div>'
     +'<p style="text-align:center;margin-block:10px 0"><button class="btn" data-go="home">Back to Lundro home</button></p></div>';
  }

  var VIEWS={home:home,lake:lake,search:search,boat:boatPage,checkout:checkout,confirm:confirm};
  function render(keepScroll){var y=window.scrollY;root.innerHTML=VIEWS[S.v]();if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0)}
  function go(v){S.v=v;S.openMap=false;render()}
  var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2200)}

  root.addEventListener('submit',function(e){
    e.preventDefault();var id=e.target.id;
    if(id==='hsearch'||id==='lsearch'||id==='ssearch'){S.sel='';go('search')}
    if(id==='notify'){toast('Thanks! We’ll email you when more lakes open.');e.target.reset()}
  });
  root.addEventListener('change',function(e){
    var t=e.target,id=t.id;
    if(id==='hdate'||id==='sdate'||id==='bdate'||id==='cdate'){S.date=t.value||S.date;if(S.v==='search')render(true)}
    else if(id==='lg'){S.guests=+t.value}
    else if(id==='sort'){S.sf.sort=t.value;render(true)}
    else if(id==='ctime'){S.time=t.value}
    else if(id==='fn'){S.f.name=t.value}else if(id==='fe'){S.f.email=t.value}else if(id==='fp'){S.f.phone=t.value}else if(id==='fc'){S.f.card=t.value}
    else if(id==='fa'){S.f.age=t.checked}else if(id==='f88'){S.f.pre88=t.checked;render(true)}
    else if(id==='org'){S.org=t.checked;render(true)}else if(id==='terms'){S.terms=t.checked}
  });
  root.addEventListener('toggle',function(e){if(e.target.dataset&&e.target.dataset.faq!==undefined&&e.target.open){S.faq=e.target.dataset.faq;root.querySelectorAll('details').forEach(function(d){if(d!==e.target)d.open=false})}},true);
  root.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;var d=t.dataset;
    if(d.go){go(d.go)}
    else if(d.toast){toast(d.toast)}
    else if(d.boat){S.boat=d.boat;S.sel=d.boat;S.step=1;go('boat')}
    else if(d.save){S.saved[d.save]=!S.saved[d.save];toast(S.saved[d.save]?'Saved to your list.':'Removed from your list.');render(true)}
    else if(d.g){S.guests=Math.max(1,Math.min(14,S.guests+(+d.g)));render(true)}
    else if(d.len){S.len=d.len;if(S.len==='full')S.time='9:00 AM';render(true)}
    else if(d.time){S.time=d.time;render(true)}
    else if(d.sel){S.sel=d.sel;render(true)}
    else if(d.area||d.areaLink){S.sf.area=d.area||B(S.boat).area;S.sf.types=[];S.v='search';render()}
    else if(d.type){S.sf.types=[d.type];S.sf.area='all';S.v='search';render()}
    else if(d.fc){S.sf.capf=S.sf.capf===d.fc?'any':d.fc;render(true)}
    else if(d.frate){S.sf.rating=S.sf.rating?0:4.5;render(true)}
    else if(d.ftube){S.sf.tube=!S.sf.tube;render(true)}
    else if(d.ftype){var a=S.sf.types,i=a.indexOf(d.ftype);if(i<0)a.push(d.ftype);else a.splice(i,1);render(true)}
    else if(d.clear){S.sf={area:'all',types:[],capf:'any',rating:0,tube:false,sort:'rec',view:'list'};render(true)}
    else if(d.map){S.openMap=!S.openMap;render()}
    else if(d.lb!==undefined){toast('Photo viewer opens in the full app.')}
    else if(t.id==='reserve'){S.step=1;go('checkout')}
    else if(d.inc){var x=X.filter(function(z){return z[0]===d.inc})[0];S.q[x[0]]=Math.min(x[4],(S.q[x[0]]||0)+1);render(true)}
    else if(d.dec){S.q[d.dec]=Math.max(0,(S.q[d.dec]||0)-1);render(true)}
    else if(d.cap!==undefined){S.cap=d.cap==='1';render(true)}
    else if(d.org){S.orgType=d.org;render(true)}
    else if(d.back){S.step=Math.max(1,S.step-1);S.tried=false;render()}
    else if(d.next){
      if(S.step===4&&!validDetails()){S.tried=true;render(true);return}
      S.step++;S.tried=false;render()}
    else if(d.pay){
      if(!S.terms){S.tried=true;render(true);return}
      S.codeN='LND-'+(1000+Math.floor(Math.random()*9000))+'-'+(1000+Math.floor(Math.random()*9000));go('confirm')}
  });
  render();
})();
</script>
