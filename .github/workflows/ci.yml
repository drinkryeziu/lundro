name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lundro
          POSTGRES_PASSWORD: lundro
          POSTGRES_DB: lundro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lundro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lundro:lundro@localhost:5432/lundro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
